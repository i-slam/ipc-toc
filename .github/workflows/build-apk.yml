name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - name: Unit tests (call log formatting)
        run: gradle testDebugUnitTest --tests "com.example.telephony.CallFormatTest" --stacktrace

      - name: Stage APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             artifacts/ipc-solution-poc-swiss-army-debug.apk
          ls -lh artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ipc-solution-poc-debug-apk
          path: artifacts/ipc-solution-poc-swiss-army-debug.apk
          if-no-files-found: error
          retention-days: 30
