name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"

env:
  APK_DEBUG: artifacts/ipc-solution-poc-swiss-army-debug.apk
  APK_SLIM: artifacts/ipc-solution-poc-swiss-army-slim.apk

jobs:
  build:
    name: Assemble APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Both keystores are generated fresh for this run and thrown away with the runner.
      # They only prove the APKs were not tampered with in transit; they are not release keys.
      - name: Create signing keystores
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -genkeypair -v \
            -keystore ci-release.keystore \
            -storepass "$CI_KEYSTORE_PASSWORD" \
            -alias upload \
            -keypass "$CI_KEYSTORE_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=IPC Solution PoC CI,O=IPC Solution PoC,C=US"
        env:
          CI_KEYSTORE_PASSWORD: ci-ephemeral-key

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - name: Assemble minified release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/ci-release.keystore
          STORE_PASSWORD: ci-ephemeral-key
          KEY_PASSWORD: ci-ephemeral-key
        run: gradle assembleRelease --stacktrace

      - name: Unit tests (call log formatting)
        run: gradle testDebugUnitTest --tests "com.example.telephony.CallFormatTest" --stacktrace

      - name: Stage APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_DEBUG"
          cp app/build/outputs/apk/release/app-release.apk "$APK_SLIM"
          ls -l artifacts
          echo "### APK sizes" >> "$GITHUB_STEP_SUMMARY"
          du -h artifacts/* >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ipc-solution-poc-apks
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

  smoke-test:
    name: Launch the minified APK on an emulator
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: ipc-solution-poc-apks
          path: artifacts

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on API 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: bash ci/smoke-test.sh artifacts/ipc-solution-poc-swiss-army-slim.apk

  publish:
    name: Publish APKs as a release
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: ipc-solution-poc-apks
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-build-${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            artifacts/*.apk \
            --target "${{ github.sha }}" \
            --title "APKs - build ${{ github.run_number }}" \
            --notes "Built from ${{ github.ref_name }} at commit ${{ github.sha }}.

          - \`ipc-solution-poc-swiss-army-slim.apk\` - minified release build, verified to launch on an emulator. Install this one.
          - \`ipc-solution-poc-swiss-army-debug.apk\` - unminified debug build, kept as a fallback.

          Both are signed with a throwaway CI key, so uninstall any earlier build before installing." \
            --latest
