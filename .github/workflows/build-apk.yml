name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"

env:
  APK_DEBUG: artifacts/ipc-solution-poc-swiss-army-debug.apk
  APK_SLIM: artifacts/ipc-solution-poc-swiss-army-slim.apk
  APK_BUBBLE: artifacts/floating-button.apk

  # The inventory database. Set these as repository secrets to get APKs that read live stock;
  # leave them unset and the build still succeeds, with the inventory screen saying it has no
  # database configured. They are read from the environment by bubble/build.gradle.kts.
  #
  # Note what setting them means: the key ends up inside a published APK, which anyone can
  # unpack. That is the normal way to ship a Supabase publishable key and it is safe only while
  # the anon role is restricted to SELECT on the vehicles table.
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  build:
    name: Assemble APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # No gradle-version here on purpose: this uses the committed wrapper, so CI and a local
      # clone run the identical Gradle, and a broken wrapper fails here rather than on someone's
      # machine.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runs first: a composition that throws during measure kills the app on launch, and this
      # catches it in a minute instead of a full emulator round trip.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # The artifact host is not reachable from every environment this is read from, so the
      # failures go into the log itself. A report you cannot open says only "there were failing
      # tests", which is what the run that prompted this did.
      - name: Name the failing tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          found = False
          for path in sorted(glob.glob("*/build/test-results/**/*.xml", recursive=True)):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      found = True
                      print(f'FAILED  {case.get("classname")}.{case.get("name")}')
                      text = (bad.get("message") or bad.text or "").strip()
                      for line in text.splitlines()[:12]:
                          print(f'        {line}')
                      print()
          if not found:
              print("No failing test cases found - the build broke before or after the tests.")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/**
            bubble/build/reports/tests/**
            core/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Signing keys come from ci/ in the repo, so each build installs over the last.
      - name: Assemble minified release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Stage APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_DEBUG"
          cp app/build/outputs/apk/release/app-release.apk "$APK_SLIM"
          cp bubble/build/outputs/apk/release/bubble-release.apk "$APK_BUBBLE"
          ls -l artifacts
          echo "### APK sizes" >> "$GITHUB_STEP_SUMMARY"
          du -h artifacts/* >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ipc-solution-poc-apks
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

  # The standalone project is handed out as a zip, so "it compiles" has to be a fact rather than
  # an assumption. The last hand-made copy shipped without a signing config and had never been
  # built; this generates it from the live sources and builds what it produces.
  standalone:
    name: Build the standalone floating-button project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate it
        run: bash ci/make-standalone.sh

      - name: Build it on its own
        working-directory: build/standalone/floating-button
        run: ./gradlew :bubble:assembleRelease --stacktrace

      - name: Report what came out
        working-directory: build/standalone/floating-button
        run: |
          ls -l bubble/build/outputs/apk/release/
          echo "### Standalone APK" >> "$GITHUB_STEP_SUMMARY"
          du -h bubble/build/outputs/apk/release/*.apk >> "$GITHUB_STEP_SUMMARY"

  smoke-test:
    name: Launch the minified APK on an emulator
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: ipc-solution-poc-apks
          path: artifacts

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on API 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: bash ci/smoke-test.sh artifacts/ipc-solution-poc-swiss-army-slim.apk

      - name: Upload bubble screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bubble-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 30

  publish:
    name: Publish APKs as a release
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: ipc-solution-poc-apks
          path: artifacts

      # Release assets download over github.com, which is reachable where the Actions artifact
      # host is not - that is how these screenshots get back out of CI.
      - name: Download bubble screenshots
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bubble-screenshots
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-build-${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            artifacts/*.apk artifacts/*.png \
            --target "${{ github.sha }}" \
            --title "APKs - build ${{ github.run_number }}" \
            --notes "Built from ${{ github.ref_name }} at commit ${{ github.sha }}.

          - \`floating-button.apk\` - the standalone floating button, its own icon and package, nothing else in it.
          - \`ipc-solution-poc-swiss-army-slim.apk\` - the full diagnostic app, minified.
          - \`ipc-solution-poc-swiss-army-debug.apk\` - the same app unminified, kept as a fallback.

          All are signed with the fixed key in ci/, so they install straight over the previous build." \
            --latest
